<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FixWeb.ID - Fix Website & Branding</title>

  <!-- SEO -->
  <meta name="description" content="Fix website & digital branding untuk UMKM. Cepat, profesional, langsung jalan." />

  <!-- Open Graph -->
  <meta property="og:title" content="FixWeb.ID" />
  <meta property="og:description" content="Fix website & digital branding UMKM" />
  <meta property="og:image" content="https://fixweb.id/og.jpg" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #fff;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
    }

    .btn {
      background: #25D366;
      color: #000;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .hero {
      margin-top: 80px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .hero p {
      color: #aaa;
      max-width: 600px;
      margin: auto;
      margin-bottom: 30px;
    }

    .section {
      margin-top: 100px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #1a1a1a;
      padding: 25px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      background: #222;
    }
