<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a12"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="whitePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="pinkCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFont" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- Bingkai Emas Tipis Elegan -->
  <rect x="24" y="24" width="552" height="352" rx="16" fill="none" stroke="url(#goldFont)" stroke-width="1.2" opacity="0.4"/>
  <rect x="30" y="30" width="540" height="340" rx="12" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.2"/>

  <!-- Cahaya Emisi Lingkaran di Belakang Bunga -->
  <circle cx="300" cy="180" r="120" fill="#10b981" opacity="0.15" filter="blur(20px)"/>

  <!-- Ilustrasi Anggrek Bulan -->
  <g transform="translate(300, 160)" filter="url(#shadow)">
    <path d="M 0,-100 C 28,-100 45,-60 0,-10 C -45,-60 -28,-100 0,-100 Z" fill="url(#whitePetal)"/>
    <path d="M -4,-12 C -40,-8 -75,20 -50,55 C -25,65 5,40 -4,-12 Z" fill="url(#whitePetal)"/>
    <path d="M 4,-12 C 40,-8 75,20 50,55 C 25,65 -5,40 4,-12 Z" fill="url(#whitePetal)"/>
    <path d="M -8,-20 C -65,-75 -115,-20 -90,20 C -65,55 -12,12 -8,-20 Z" fill="url(#whitePetal)"/>
    <circle cx="-55" cy="-2" r="38" fill="url(#pinkCenter)"/>
    <path d="M 8,-20 C 65,-75 115,-20 90,20 C 65,55 12,12 8,-20 Z" fill="url(#whitePetal)"/>
    <circle cx="55" cy="-2" r="38" fill="url(#pinkCenter)"/>
    <path d="M -18,8 C -25,22 -12,38 0,40 C 12,38 25,22 18,8 C 8,15 -8,15 -18,8 Z" fill="url(#lipGrad)"/>
    <ellipse cx="0" cy="-4" rx="7" ry="10" fill="#ffffff" stroke="#fde047" stroke-width="1"/>
  </g>

  <!-- Panel Informasi Nama File yang Harus Diunggah -->
  <g>
    <rect x="60" y="275" width="480" height="56" rx="10" fill="rgba(2, 26, 18, 0.85)" stroke="url(#goldFont)" stroke-width="1"/>
    
    <text x="300" y="297" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="10" 
          font-weight="700" 
          fill="#fef08a" 
          text-anchor="middle" 
          letter-spacing="1.5">
      UPLOAD FOTO KE FOLDER (img/):
    </text>

    <!-- Nama file akan disuntikkan secara dinamis ke sini -->
    <text x="300" y="320" 
          font-family="monospace, sans-serif" 
          font-size="14" 
          font-weight="bold" 
          fill="#34d399" 
          text-anchor="middle">
      <tspan id="dynamic-filename">memuat...</tspan>
    </text>
  </g>
</svg>
