<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradasi Latar Belakang -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022117"/>
      <stop offset="100%" stop-color="#053e2b"/>
    </linearGradient>
    
    <!-- Gradasi Anggrek/Daun -->
    <linearGradient id="orchidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Latar Belakang Kotak dengan Sudut Melengkung Elegan -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Lingkaran Dekoratif Transparan -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Ikon Kelopak Bunga Anggrek & Kamera (FixFoto) -->
  <g transform="translate(250, 205)">
    <!-- Kelopak Bunga Anggrek Estetik -->
    <path d="M 0,-90 C 35,-60 60,-20 50,20 C 40,60 10,80 0,95 C -10,80 -40,60 -50,20 C -60,-20 -35,-60 0,-90 Z" fill="url(#orchidGrad)" opacity="0.9"/>
    <path d="M -90,0 C -60,35 -20,60 20,50 C 60,40 80,10 95,0 C 80,-10 60,-40 20,-50 C -20,-60 -60,-35 -90,0 Z" fill="url(#orchidGrad)" opacity="0.8"/>
    
    <!-- Badan Lensa Kamera di Tengah Bunga -->
    <circle cx="0" cy="0" r="45" fill="#022117" stroke="url(#accentGrad)" stroke-width="6" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="4 4" />
    <circle cx="-10" cy="-10" r="8" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Teks Brand: FIXFOTO -->
  <text x="250" y="385" font-family="'Playfair Display', serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">fixfoto</text>
  
  <!-- Sub-teks -->
  <text x="250" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#34d399" text-anchor="middle" letter-spacing="3">OFFICIAL ASSET</text>
</svg>
