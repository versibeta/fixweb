<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradasi Biru Profesional -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
  </defs>

  <!-- Background Gelap Elegan -->
  <rect width="500" height="500" fill="#0b1329" rx="40" />

  <!-- Ikon Simbol Code Tag </> di Tengah Atas -->
  <g transform="translate(150, 110)">
    <!-- Kurang dari < -->
    <path d="M 60 10 L 10 70 L 60 130" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Garis Miring / -->
    <path d="M 115 5 L 85 135" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Lebih dari > -->
    <path d="M 140 10 L 190 70 L 140 130" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Teks Brand fixweb.id & Slogan -->
  <text x="250" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="48" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">fixweb<tspan fill="#00d2ff">.id</tspan></text>
  <text x="250" y="385" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="2">Solusi Website &amp; Aplikasi Anda</text>
</svg>
