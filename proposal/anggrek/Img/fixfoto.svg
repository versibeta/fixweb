<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradasi Gelap Elegan -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1b"/>
      <stop offset="100%" stop-color="#0b162c"/>
    </linearGradient>

    <!-- Gradasi Biru Logo FixWeb -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Kotak -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="30"/>

  <!-- Logo Utama (Simbol Code Tag </> DIPERKECIL & Disesuaikan Posisinya) -->
  <g transform="translate(125, 90) scale(0.8)" filter="url(#shadow)">
    <!-- Kurang dari < -->
    <path d="M 75 15 L 10 85 L 75 155" fill="none" stroke="url(#blueGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Garis Miring / -->
    <path d="M 145 5 L 105 165" fill="none" stroke="url(#blueGrad)" stroke-width="18" stroke-linecap="round"/>
    <!-- Lebih dari > -->
    <path d="M 175 15 L 240 85 L 175 155" fill="none" stroke="url(#blueGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Teks Brand fixweb.id & Slogan -->
  <g transform="translate(250, 310)" text-anchor="middle">
    <!-- fixweb.id -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" fill="#ffffff" letter-spacing="1">fixweb<tspan fill="#00d2ff">.id</tspan></text>
    <!-- Slogan -->
    <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" letter-spacing="1.5">Solusi Website &amp; Aplikasi Anda</text>
  </g>
</svg>
